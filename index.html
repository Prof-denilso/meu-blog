<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
       header{
        background-color: #1D426A;
        color: #FBFBFB;
        text-align: center;
        max-width: 500px;
        margin: auto;
       } 
    main{
       background-color: white; 
       color: #1D426A;
        max-width: 500px;
        margin: auto;
        display: flex;
    }
    img{
       width: 150px; /* Largura*/
       height: 150px; /* Altura*/
    }
    .dono-do-blog{
        font-weight: bold;
    }
    </style>
</head>
<body>
    <header>
        <h1>Blog Sobre tecnologia</h1>
        <p>Vou falar sobre ternologia e programação</p>
    </header>
   <main>
        <img src="./Gemini_Generated_Image_x9n1byx9n1byx9n1.png" alt="">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="dono-do-blog">Por: Denilso</p> 
            <p>Bem vindo ao meu site, aqui falaremos sobre programação</p>
            <button>❤️<span>0</span></button>
        </div>
   </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);
    function botaoClicado(){
        let texto = botao.querySelector("span");
        texto.textContent++;
    }
</script>
</html>
